name: Native Codex bundle
on:
  workflow_dispatch:
  pull_request:
    paths: ['codex/**', '*codex*.py', 'tests/test_*codex*.py', 'context_statusline.py', '.github/workflows/codex-native.yml']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      CARGO_PROFILE_RELEASE_LTO: 'false'
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.14'
      - name: Install Linux native build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev libasound2-dev libcap-dev clang cmake ninja-build
      - name: Verify adapters and installer
        shell: bash
        run: python -m unittest discover -s tests -p 'test_*codex*.py' -v
      - name: Fetch and patch the pinned source
        shell: bash
        run: python codex/build.py --source "$RUNNER_TEMP/codex-statusline-source" --check
      - name: Install the source's own Rust toolchain
        shell: bash
        working-directory: ${{ runner.temp }}/codex-statusline-source/codex-rs
        run: rustup toolchain install
      - name: Build pinned source and package
        shell: bash
        run: python codex/build.py --source "$RUNNER_TEMP/codex-statusline-source" --output "$RUNNER_TEMP/codex-statusline-bundle"
      - name: Test the native panel and composer layout
        shell: bash
        working-directory: ${{ runner.temp }}/codex-statusline-source/codex-rs
        # Same target and profile as upstream's packager, so the test reuses its build.
        run: |
          env -u NO_COLOR cargo test --target "$(rustc -vV | sed -n 's/^host: //p')" --release -p codex-tui --lib context_statusline
      - name: Verify the actual bundled launcher
        shell: bash
        run: |
          python install_codex.py "$RUNNER_TEMP/codex-statusline-bundle" --prefix "$RUNNER_TEMP/install prefix"
          python "$RUNNER_TEMP/codex-statusline-bundle/launch_codex.py" --version
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-statusline-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/codex-statusline-bundle
          retention-days: 14
